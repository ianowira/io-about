version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Johannesburg"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # Group TypeScript and its ESLint ecosystem together first
      typescript-eslint-stack:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint-config-next"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch", "major"]
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-dependencies-security:
        applies-to: security-updates
        dependency-type: "development"
      production-security:
        applies-to: security-updates
        dependency-type: "production"